name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: this workflow only checks code.
permissions:
  contents: read

# A new push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-size:
    name: PR size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: bash .github/scripts/check-pr-size.sh "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/sandbox-agent/go.mod
          cache-dependency-path: apps/*/go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Every challenge folder: required files, a manifest the schema accepts, id = folder, hint count.
      - run: pnpm challenges:validate

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # The committed gRPC code must match agent.proto (architecture.md, task 37a). The only place
      # the generator versions are pinned; packages/agent-api/generate.sh points here.
      - name: Check generated gRPC code
        run: |
          curl -fsSLo "${RUNNER_TEMP}/protoc.zip" https://github.com/protocolbuffers/protobuf/releases/download/v36.0/protoc-36.0-linux-x86_64.zip
          sudo unzip -q -o "${RUNNER_TEMP}/protoc.zip" -d /usr/local bin/protoc "include/*"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          bash .github/scripts/check-grpc-codegen.sh

  sandbox-integration:
    name: Sandbox integration (gVisor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pinned so a gVisor release cannot change CI behaviour without a PR.
      GVISOR_RELEASE: "20260928"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/sandbox-agent/go.mod
          cache-dependency-path: apps/sandbox-agent/go.sum

      - run: bash .github/scripts/install-gvisor.sh "$GVISOR_RELEASE"

      # Same test as `pnpm --filter @greenbuild/sandbox-agent test:integration`, under runsc.
      - run: go test -tags integration -count=1 -v -run OnRealDocker ./...
        working-directory: apps/sandbox-agent
        env:
          SANDBOX_TEST_RUNTIME: runsc

      # The engine creates and destroys a sandbox through the real agent process, under runsc.
      - run: go test -tags integration -count=1 -v -run OnRealDocker ./...
        working-directory: apps/sandbox-engine
        env:
          SANDBOX_TEST_RUNTIME: runsc

  challenges:
    name: Challenges (gVisor)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Same pinned release as the sandbox integration job.
      GVISOR_RELEASE: "20260928"
      SANDBOX_TEST_RUNTIME: runsc
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: bash .github/scripts/install-gvisor.sh "$GVISOR_RELEASE"

      # A challenge whose setup breaks nothing must be rejected, so this job can fail at all.
      - name: Reject the unbroken fixture
        run: |
          if bash challenges/verify-challenge.sh packages/challenge-spec/fixtures/unbroken 1 > fixture.log 2>&1; then
            cat fixture.log
            echo "::error::the unbroken fixture passed verification"
            exit 1
          fi
          grep "check passes before the fix" fixture.log

      # setup.sh breaks the environment, check.sh fails, solution.sh fixes it, check.sh passes; three seeds each.
      - name: Verify changed challenges
        run: |
          for dir in $(bash .github/scripts/changed-challenges.sh "$BASE_SHA"); do
            bash challenges/verify-challenge.sh "$dir"
          done
        env:
          # Empty on pushes to main, which verifies every challenge.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  slice-e2e:
    name: Slice e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/sandbox-agent/go.mod
          cache-dependency-path: apps/*/go.sum

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @greenbuild/web exec playwright install --with-deps chromium

      # The same stack as `pnpm play:up`: Postgres, Redis, agent (runc), engine, API and web.
      - run: bash scripts/play-stack.sh up

      # A player starts nginx-502, fails a check, fixes the site in the terminal and reads the debrief.
      - run: pnpm --filter @greenbuild/web test:e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: slice-e2e
          path: |
            .play/logs
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - if: always()
        run: bash scripts/play-stack.sh down
