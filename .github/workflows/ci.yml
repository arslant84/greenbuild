name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: this workflow only checks code.
permissions:
  contents: read

# A new push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-size:
    name: PR size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: bash .github/scripts/check-pr-size.sh "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/sandbox-agent/go.mod
          cache-dependency-path: apps/*/go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  sandbox-integration:
    name: Sandbox integration (gVisor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pinned so a gVisor release cannot change CI behaviour without a PR.
      GVISOR_RELEASE: "20260928"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/sandbox-agent/go.mod
          cache-dependency-path: apps/sandbox-agent/go.sum

      - run: bash .github/scripts/install-gvisor.sh "$GVISOR_RELEASE"

      - name: TEMPORARY - diagnose PTY size under runsc vs runc
        run: |
          set +e
          docker pull -q alpine:3
          for runtime in runsc runc; do
            c=$(docker run -d --runtime "$runtime" alpine:3 sleep 120)
            echo "===== $runtime: docker exec -it stty size"
            script -qec "stty rows 24 cols 80; docker exec -it $c stty size; echo exit=\$?" /dev/null
            echo "===== $runtime: details"
            script -qec "stty rows 24 cols 80; docker exec -it $c sh -c 'ls -l /proc/self/fd/0; stty -a 2>&1 | head -3; echo COLUMNS=\$COLUMNS'" /dev/null
            echo "===== $runtime: busybox stty size on /dev/tty"
            script -qec "stty rows 24 cols 80; docker exec -it $c sh -c 'stty -F /dev/tty size; echo exit=\$?'" /dev/null
            docker rm -f "$c" > /dev/null
          done

      # Same test as `pnpm --filter @greenbuild/sandbox-agent test:integration`, under runsc.
      - run: go test -tags integration -count=1 -v -run OnRealDocker ./internal/sandbox/...
        working-directory: apps/sandbox-agent
        env:
          SANDBOX_TEST_RUNTIME: runsc
