name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: this workflow only checks code.
permissions:
  contents: read

# A new push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-size:
    name: PR size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: bash .github/scripts/check-pr-size.sh "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/sandbox-agent/go.mod
          cache-dependency-path: apps/*/go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Every challenge folder: required files, a manifest the schema accepts, id = folder, hint count.
      - run: pnpm challenges:validate

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # The committed gRPC code must match agent.proto (architecture.md, task 37a). The only place
      # the generator versions are pinned; packages/agent-api/generate.sh points here.
      - name: Check generated gRPC code
        run: |
          curl -fsSLo "${RUNNER_TEMP}/protoc.zip" https://github.com/protocolbuffers/protobuf/releases/download/v36.0/protoc-36.0-linux-x86_64.zip
          sudo unzip -q -o "${RUNNER_TEMP}/protoc.zip" -d /usr/local bin/protoc "include/*"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          bash .github/scripts/check-grpc-codegen.sh

  sandbox-integration:
    name: Sandbox integration (gVisor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pinned so a gVisor release cannot change CI behaviour without a PR.
      GVISOR_RELEASE: "20260928"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/sandbox-agent/go.mod
          cache-dependency-path: apps/sandbox-agent/go.sum

      - run: bash .github/scripts/install-gvisor.sh "$GVISOR_RELEASE"

      # Same test as `pnpm --filter @greenbuild/sandbox-agent test:integration`, under runsc.
      - run: go test -tags integration -count=1 -v -run OnRealDocker ./...
        working-directory: apps/sandbox-agent
        env:
          SANDBOX_TEST_RUNTIME: runsc

      # Limits that exist only under runsc, such as the root overlay cap (task 33b).
      - run: go test -tags integration -count=1 -v -run OnRunsc ./...
        working-directory: apps/sandbox-agent

      # The engine creates and destroys a sandbox through the real agent process, under runsc.
      - run: go test -tags integration -count=1 -v -run OnRealDocker ./...
        working-directory: apps/sandbox-engine
        env:
          SANDBOX_TEST_RUNTIME: runsc

  challenges:
    name: Challenges (gVisor)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Same pinned release as the sandbox integration job.
      GVISOR_RELEASE: "20260928"
      SANDBOX_TEST_RUNTIME: runsc
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: bash .github/scripts/install-gvisor.sh "$GVISOR_RELEASE"

      # A challenge whose setup breaks nothing must be rejected, so this job can fail at all.
      - name: Reject the unbroken fixture
        run: |
          if bash challenges/verify-challenge.sh packages/challenge-spec/fixtures/unbroken 1 > fixture.log 2>&1; then
            cat fixture.log
            echo "::error::the unbroken fixture passed verification"
            exit 1
          fi
          grep "check passes before the fix" fixture.log

      # setup.sh breaks the environment, check.sh fails, solution.sh fixes it, check.sh passes; three seeds each.
      - name: Verify changed challenges
        run: |
          for dir in $(bash .github/scripts/changed-challenges.sh "$BASE_SHA"); do
            bash challenges/verify-challenge.sh "$dir"
          done
        env:
          # Empty on pushes to main, which verifies every challenge.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  terraform:
    name: Terraform
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write       # OIDC sign-in to Azure for the plan; no Azure secret is stored
      pull-requests: write  # the plan as a PR comment
    env:
      # Pinned like the provider; infra/terraform/envs/staging/versions.tf allows 1.16.x.
      TERRAFORM_VERSION: "1.16.2"
      STAGING_DIR: infra/terraform/envs/staging
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find Terraform changes
        id: changed
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- infra/terraform; then
            echo "terraform=false" >> "$GITHUB_OUTPUT"
            echo "No change under infra/terraform: nothing to check." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "terraform=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - if: steps.changed.outputs.terraform == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - if: steps.changed.outputs.terraform == 'true'
        run: terraform fmt -check -recursive -diff infra/terraform

      - if: steps.changed.outputs.terraform == 'true'
        working-directory: ${{ env.STAGING_DIR }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

      # The plan needs the owner's Azure sign-in (docs/runbooks/terraform-state.md). PRs from forks get no
      # OIDC token, so they stop at validate too.
      - name: Decide on the plan
        id: plan
        if: steps.changed.outputs.terraform == 'true'
        run: |
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_SUBSCRIPTION_ID" ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Plan skipped: AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID are not set, or the PR comes from a fork." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Plan staging
        if: steps.plan.outputs.run == 'true'
        working-directory: ${{ env.STAGING_DIR }}
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -lock-timeout=5m | tee "$RUNNER_TEMP/plan.txt"
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - if: steps.plan.outputs.run == 'true'
        run: bash .github/scripts/terraform-plan-comment.sh "$RUNNER_TEMP/plan.txt"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}

  slice-e2e:
    name: Slice e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/sandbox-agent/go.mod
          cache-dependency-path: apps/*/go.sum

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @greenbuild/web exec playwright install --with-deps chromium

      # The same stack as `pnpm play:up`: Postgres, Redis, agent (runc), engine, API and web, with the
      # test sign-in Playwright uses (task 30d).
      - run: bash scripts/play-stack.sh up
        env:
          GREENBUILD_E2E_AUTH: "1"

      # A player starts nginx-502, fails a check, fixes the site in the terminal and reads the debrief.
      - run: pnpm --filter @greenbuild/web test:e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: slice-e2e
          path: |
            .play/logs
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - if: always()
        run: bash scripts/play-stack.sh down
