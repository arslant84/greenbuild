# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: shared-library-path
version: 1
title: "Library not found after the upgrade"
statement: "Since the vendor's pricer was upgraded last night, the nightly price list is empty: the pricer will not start, though its files are all there. Get the price job running again, without breaking anything else on the host."
difficulty: 4            # 1–10
skills: { linux: 1 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 512Mi
  disk: 1Gi
network: none            # none | allowlist
# The price job runs as its own user, with its own output and log directories.
capabilities: [CHOWN, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  app: { pick: [pricing, quotes, offers] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 20
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
