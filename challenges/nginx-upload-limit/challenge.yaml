# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: nginx-upload-limit
version: 1
title: "Too big to ship"
statement: "Engineers can no longer upload build artifacts to the artifact store; anything but tiny files fails. Artifacts are up to 20 MB. Make uploads work without opening the store to any size."
difficulty: 3            # 1–10
skills: { nginx: 0.7, linux: 0.3 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 512Mi
  disk: 1Gi
network: none            # none | allowlist
# nginx chowns its cache at start and its workers switch users; root gives the store to nginx.
capabilities: [CHOWN, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  store: { pick: [artifacts, builds, releases] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 20
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
