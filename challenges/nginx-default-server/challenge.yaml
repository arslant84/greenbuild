# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: nginx-default-server
version: 1
title: "Someone else's homepage"
statement: "Yesterday the marketing team's launch page went live on our shared nginx. Since then, customers who open the app's address get the launch page instead of the app. Give the app back to its customers without taking the launch page down."
difficulty: 3            # 1–10
skills: { nginx: 0.8, linux: 0.2 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 512Mi
  disk: 1Gi
network: none            # none | allowlist
# nginx chowns its cache at start and its workers switch users.
capabilities: [CHOWN, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  app: { pick: [shop, billing, status] }
  typo: { pick: [transposed, missing, plural] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 20
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
