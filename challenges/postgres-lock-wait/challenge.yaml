# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: postgres-lock-wait
version: 1
title: "One customer can't pay"
statement: "Since last night, every payment to one customer's account fails after a few seconds, while payments to every other account go through. Nothing was deployed. Let that customer's payments through again without restarting the database."
difficulty: 4            # 1–10
skills: { postgresql: 0.8, linux: 0.2 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 512Mi
  disk: 1Gi
network: none            # none | allowlist
# PostgreSQL runs as its own user; root starts it and runs the app's script.
capabilities: [CHOWN, DAC_OVERRIDE, KILL, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  database: { pick: [ledger, billing, wallet] }
  account: { range: [100, 199] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 30
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
