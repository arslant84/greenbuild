# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: tls-chain-missing
version: 1
title: "Trusted yesterday"
statement: "Yesterday the intranet's certificate was renewed. Since then employees' browsers refuse the site as untrusted, although the new certificate is valid and was issued by our usual internal certificate authority. Make the site trusted again."
difficulty: 4            # 1–10
skills: { tls: 0.6, nginx: 0.4 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 512Mi
  disk: 1Gi
network: none            # none | allowlist
# nginx chowns its cache at start and its workers switch users.
capabilities: [CHOWN, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  site: { pick: [intranet, wiki, portal] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 20
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
