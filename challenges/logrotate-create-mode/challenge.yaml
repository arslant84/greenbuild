# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: logrotate-create-mode
version: 1
title: "Silent since the rotation"
statement: "The worker is running and processing batches, but its log has stayed empty since last night's log rotation. Get it logging again, and make sure it survives tonight's rotation too."
difficulty: 3            # 1–10
skills: { linux: 1 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 512Mi
  disk: 1Gi
network: none            # none | allowlist
# The worker runs as its own user and owns its log directory, where logrotate moves, creates and copies
# files and sets their modes.
capabilities: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  app: { pick: [ingest, mailer, billing] }
  rotate: { range: [5, 14] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 20
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
