# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: nginx-websocket-upgrade
version: 1
title: "Stuck on reconnecting"
statement: "The app moved behind nginx yesterday. The page loads fine, but its live feed never connects: the browser keeps showing \"reconnecting…\", though the feed service is running. Get the live feed connecting through the site."
difficulty: 4            # 1–10
skills: { nginx: 0.8, linux: 0.2 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 512Mi
  disk: 1Gi
network: none            # none | allowlist
# The feed runs as its own user with its log directory; nginx keeps its logs and temp files in
# directories its own user owns, and its workers switch users.
capabilities: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  app: { pick: [chat, tracker, auction] }
  port: { range: [8100, 8899] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 20
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
