# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: app-open-files
version: 1
title: "Too many customers"
statement: "Since yesterday's onboarding of new customers the media server will not start, and the site answers 502. Bring it back without dropping any customer."
difficulty: 4            # 1–10
skills: { linux: 0.8, nginx: 0.2 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 512Mi
  disk: 1Gi
network: none            # none | allowlist
# nginx chowns its cache at start; the app switches users; root writes the app's log and
# signals the app's process (appctl status and stop), as on a server.
capabilities: [CHOWN, DAC_OVERRIDE, KILL, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  app: { pick: [media, assets, uploads] }
  app_user: { pick: [svc, appsvc, runner] }
  app_port: { range: [5000, 5999] }
  tenants: { range: [40, 60] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 20
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
