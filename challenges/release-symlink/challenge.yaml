# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: release-symlink
version: 1
title: "Nothing to see here"
statement: "Since last night's deploy every page of the site answers 404. Put the site back on the last release that worked."
difficulty: 3            # 1–10
skills: { linux: 0.7, nginx: 0.3 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 512Mi
  disk: 1Gi
network: none            # none | allowlist
# nginx chowns its cache at start; its workers switch users; root changes the deploy user's files,
# as on a server.
capabilities: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  app: { pick: [shop, docs, portal] }
  release_day: { range: [1, 28] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 20
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
