# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: pip-user-site
version: 1
title: "Installed, but not for the app"
statement: "Last night's deploy installed the invoice library the billing app now needs, and the deploy log says it succeeded. The app has not started since. Get the app serving invoices again."
difficulty: 3            # 1–10
skills: { python: 0.6, linux: 0.4 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 512Mi
  disk: 1Gi
network: none            # none | allowlist
# The app runs as its own user; root installs libraries and starts the app.
capabilities: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  app: { pick: [billing, invoicing, accounts] }
  port: { range: [8000, 8999] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 20
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
