# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: php-fpm-socket
version: 1
title: "Hardened into a 502"
statement: "The security team hardened the PHP-FPM pool yesterday. Since then the site answers 502. Bring it back without undoing the hardening."
difficulty: 4            # 1–10
skills: { linux: 0.5, nginx: 0.3, php: 0.2 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 512Mi
  disk: 1Gi
network: none            # none | allowlist
# PHP-FPM chowns its socket and signals its workers; nginx chowns its cache; both switch users;
# root fixes files it does not own, as on a server.
capabilities: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  app: { pick: [shop, crm, blog] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 20
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
