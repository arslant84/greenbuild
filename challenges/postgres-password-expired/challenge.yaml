# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: postgres-password-expired
version: 1
title: "The password nobody changed"
statement: "Since early this morning the app cannot log in to its PostgreSQL database: the database says the password is wrong. Nobody has touched the app's settings or the database for weeks. Let the app in again without making the database easier to get into."
difficulty: 3            # 1–10
skills: { postgresql: 0.7, linux: 0.3 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 512Mi
  disk: 1Gi
network: none            # none | allowlist
# PostgreSQL runs as its own user; root changes the app's settings and runs psql as postgres.
capabilities: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  database: { pick: [orders, payroll, inventory] }
  expired_hours_ago: { range: [2, 11] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 20
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
