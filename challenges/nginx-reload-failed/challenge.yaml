# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: nginx-reload-failed
version: 1
title: "Deployed, but still yesterday"
statement: "This morning's deploy finished without an error and switched the site to the new release, yet the site still shows the old one. Get the new release live, and keep everything the site does today working."
difficulty: 3            # 1–10
skills: { nginx: 0.7, linux: 0.3 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 512Mi
  disk: 1Gi
network: none            # none | allowlist
# nginx chowns its cache at start and its workers switch users.
capabilities: [CHOWN, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  release: { range: [40, 89] }
  legacy_path: { pick: [old-docs, wiki, help-center] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 20
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
