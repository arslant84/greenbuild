# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: sqlite-readonly-dir
version: 1
title: "Read-only since the restore"
statement: "Last night the app's data was restored from backup. The app is up and shows its pages, but every action that saves something fails. Make it save again."
difficulty: 3            # 1–10
skills: { linux: 0.7, python: 0.3 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 512Mi
  disk: 1Gi
network: none            # none | allowlist
# The app runs as its own user; root restores and fixes ownership.
capabilities: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  app: { pick: [notes, orders, tickets] }
  port: { range: [8000, 8999] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 20
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
