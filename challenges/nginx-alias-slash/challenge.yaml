# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: nginx-alias-slash
version: 1
title: "Unstyled after the deploy"
statement: "Since last night's deploy, the site loads as plain text: every stylesheet and script answers 404, though the files are on the server. Get the assets loading again."
difficulty: 3            # 1–10
skills: { nginx: 0.8, linux: 0.2 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 512Mi
  disk: 1Gi
network: none            # none | allowlist
# nginx chowns its cache at start and its workers switch users.
capabilities: [CHOWN, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  site: { pick: [storefront, dashboard, docs] }
  release: { range: [10, 27] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 20
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
