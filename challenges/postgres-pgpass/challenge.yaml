# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: postgres-pgpass
version: 1
title: "No password supplied"
statement: "Since configuration management took over the backup server's files, the nightly database dump fails with \"no password supplied\", though the password file is right there. Get the dumps running again without weakening the database's login."
difficulty: 3            # 1–10
skills: { postgresql: 0.7, linux: 0.3 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 512Mi
  disk: 1Gi
network: none            # none | allowlist
# PostgreSQL and the dump run as their own users; setup gives each their files.
capabilities: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  database: { pick: [shop, tickets, billing] }
  orders: { range: [40, 89] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 20
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
