# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: postgres-pg-hba
version: 1
title: "Hardened out of its own database"
statement: "Since the security hardening last night the app cannot connect to its PostgreSQL database on this host. PostgreSQL runs and the app's password has not changed. Let the app in again without making the database easier to get into."
difficulty: 4            # 1–10
skills: { postgresql: 0.7, linux: 0.3 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 512Mi
  disk: 1Gi
network: none            # none | allowlist
# PostgreSQL runs as its own user; root edits the configuration it owns and can give it back.
capabilities: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  database: { pick: [shop, crm, billing] }
  role: { pick: [shop_app, crm_app, billing_app] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 20
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
