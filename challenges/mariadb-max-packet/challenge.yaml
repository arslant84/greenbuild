# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: mariadb-max-packet
version: 1
title: "Packet too big, still"
statement: "The nightly import of the document bundle into MariaDB fails. Ops raised max_allowed_packet yesterday, but the import fails exactly as before. Get the bundle loading again, in a way that survives a database restart."
difficulty: 3            # 1–10
skills: { mysql: 0.8, linux: 0.2 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 512Mi
  disk: 1Gi
network: none            # none | allowlist
# MariaDB and the import run as their own users; setup gives each their files.
capabilities: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  app: { pick: [docs, contracts, media] }
  bundle_kb: { range: [3072, 6143] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 60
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
