# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: deploy-path
version: 1
title: "Release that never shipped"
statement: "Last night's release never went live: the site still shows the old version. Make the deploy script work, then ship the release with it."
difficulty: 3            # 1–10
skills: { linux: 0.8, nginx: 0.2 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 512Mi
  disk: 1Gi
network: none            # none | allowlist
# nginx chowns its cache at start and its workers switch users; tar sets the owners of released files.
capabilities: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  site: { pick: [shop, docs, status] }
  release: { range: [10, 39] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 20
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
