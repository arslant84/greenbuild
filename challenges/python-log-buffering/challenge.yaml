# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: python-log-buffering
version: 1
title: "The log lags behind"
statement: "Since the worker moved to its start script, its log stays silent for minutes and then dumps a burst of lines, and after a restart the last minutes of work are never logged at all. The worker itself runs fine. Make its log keep up with its work."
difficulty: 3            # 1–10
skills: { python: 0.6, linux: 0.4 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 512Mi
  disk: 1Gi
network: none            # none | allowlist
# The worker runs as its own user; restarting it signals that user's process.
capabilities: [CHOWN, KILL, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  app: { pick: [mailer, thumbnailer, indexer] }
  first_job: { range: [1000, 9999] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 20
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
