# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: dotenv-hash-comment
version: 1
title: "Half a secret"
statement: "Since yesterday's rotation of the payment provider's webhook secret, customers pay but their orders stay unpaid: the shop refuses every payment notification. The new secret was copied exactly from the provider's dashboard. Get payments recorded again, including this morning's."
difficulty: 3            # 1–10
skills: { linux: 0.6, nodejs: 0.4 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 256Mi
  disk: 1Gi
network: none            # none | allowlist
# The receiver runs as its own user; root restarts it and gives it its files.
capabilities: [CHOWN, KILL, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  app: { pick: [store, bookings, tickets] }
  port: { range: [4000, 4999] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 30
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
