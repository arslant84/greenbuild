# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: nginx-403-permissions
version: 1
title: "The site answers 403 Forbidden"
statement: "After last night's deploy the site answers 403 Forbidden. Make it serve the page again."
difficulty: 3            # 1–10
skills: { linux: 0.7, nginx: 0.3 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 512Mi
  disk: 1Gi
network: none            # none | allowlist
# nginx workers switch users; setup chowns the site; root fixes files it does not own, as on a server.
capabilities: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  site: { pick: [docs, shop, portal] }
  deploy_user: { pick: [deploy, release, ci] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 20
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
