# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: venv-moved
version: 1
title: "Not found, but right there"
statement: "The report service's new release was installed an hour ago, and since then it does not start: its program is reported missing, although it is right where the start script looks. Get the service running from its release."
difficulty: 3            # 1–10
skills: { python: 0.6, linux: 0.4 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 512Mi
  disk: 1Gi
network: none            # none | allowlist
# The service runs as its own user; root rebuilds its virtualenv and restarts it.
capabilities: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  app: { pick: [reports, exports, metrics] }
  build: { range: [1000, 9999] }
  port: { range: [8000, 8999] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 30
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
