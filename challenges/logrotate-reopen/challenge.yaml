# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: logrotate-reopen
version: 1
title: "Zero visitors"
statement: "Since log rotation was set up yesterday, the traffic dashboard shows zero visitors, although the site is busy. The dashboard reads /var/log/nginx/access.log. Make the rotation work."
difficulty: 3            # 1–10
skills: { linux: 0.7, nginx: 0.3 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 512Mi
  disk: 1Gi
network: none            # none | allowlist
# nginx chowns its cache at start and logrotate sets the owner and mode of new logs; nginx workers switch
# users; root writes the logs, as on a server.
capabilities: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  site: { pick: [shop, news, portal] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 20
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
