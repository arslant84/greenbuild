# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: postgres-data-permissions
version: 1
title: "The restore went fine, they said"
statement: "Last night's database restore finished without errors, but PostgreSQL will not start this morning. Bring it back with the restored data."
difficulty: 4            # 1–10
skills: { linux: 0.6, postgresql: 0.4 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 512Mi
  disk: 1Gi
network: none            # none | allowlist
# PostgreSQL switches to its own user; root must be able to fix files it does not own and stop the
# server's processes, as on a server.
capabilities: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  database: { pick: [shop, crm, billing] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 20
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
