# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: cron-path
version: 1
title: "Not found, every night"
statement: "Since last week's server hardening, the nightly report export has not produced a single file, although it runs fine when someone starts it by hand. Make the scheduled export work again."
difficulty: 3            # 1–10
skills: { linux: 1.0 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 512Mi
  disk: 1Gi
network: none            # none | allowlist
capabilities: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  report: { pick: [sales, inventory, payroll] }
  hour: { range: [1, 4] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 20
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
