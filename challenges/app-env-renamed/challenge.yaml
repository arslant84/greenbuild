# yaml-language-server: $schema=../../packages/challenge-spec/challenge.schema.json
id: app-env-renamed
version: 1
title: "The app will not start after the upgrade"
statement: "After last night's upgrade to version 2.0 the app does not start and the site answers 502. Bring it back."
difficulty: 3            # 1–10
skills: { linux: 0.8, nginx: 0.2 }
time_limit_sec: 900
resources:
  cpu: 500m
  memory: 512Mi
  disk: 1Gi
network: none            # none | allowlist
# nginx chowns its cache at start; nginx workers and the app switch users; root writes the app's log, as on a server.
capabilities: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
randomize:               # applied by setup.sh from the attempt seed
  app: { pick: [orders, billing, catalog] }
  app_user: { pick: [svc, appsvc, runner] }
  app_port: { range: [4000, 4999] }
check:
  command: /opt/greenbuild/check.sh
  timeout_sec: 20
  run_as: root           # the checker is not visible to the user
hints: 3
source: ai               # human | ai | community
